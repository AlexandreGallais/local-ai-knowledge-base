<label
  for="state-filter"
>State</label>
<select
  id="state-filter"
  data-testid="state-filter"
  (change)="onFilterChange($event)"
>
  @for (filter of filters; track filter) {
    <option
      [value]="filter"
    >{{ filter }}</option>
  }
</select>
<table>
  <thead>
    <tr>
      <th
        scope="col"
      >Tag</th>
      <th
        scope="col"
      >State</th>
    </tr>
  </thead>
  <tbody>
    @for (row of store.visibleRows(); track row.tag) {
      <tr
        data-testid="valve-row"
      >
        <td>{{ row.tag }}</td>
        <td>{{ row.state }}</td>
      </tr>
    }
  </tbody>
</table>
